<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cette page n'existe pas ou plus. Retournez à l'accueil de MatMax Intelligence.">
<meta name="robots" content="noindex,follow">
<title>Page introuvable — MatMax Intelligence</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-alt:#F5F7FC; --ink:#14141A; --muted:#565B6E; --dim:#9297AA; --line:#E3E7F2;
    --accent:#1149FE; --accent-ink:#081F7A; --accent-soft:#EAF0FF; --radius:8px; --maxw:1180px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{ background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; letter-spacing:-0.015em; }
  a{ color:inherit; text-decoration:none; }
  img,svg{ display:block; max-width:100%; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 32px; }

  header{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; height:78px; }
  .logo{ font-family:'Bricolage Grotesque'; font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:8px; }
  .logo img{ height:28px; width:auto; }

  .btn{ display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:var(--radius); font-size:.95rem; font-weight:600; transition:all .2s; border:1px solid transparent; font-family:'Inter'; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ background:var(--accent); transform:translateY(-1px); }

  .lost-wrap{ min-height:62vh; display:flex; align-items:center; justify-content:center; padding:80px 24px; }
  .lost-card{ max-width:480px; text-align:center; }
  .lost-card .code{ font-family:'Bricolage Grotesque'; font-weight:700; font-size:3.2rem; color:var(--accent); margin-bottom:8px; }
  .lost-card h1{ font-size:clamp(1.5rem,3vw,2rem); margin-bottom:16px; }
  .lost-card p{ color:var(--muted); font-size:1rem; margin-bottom:32px; }

  footer{ padding:40px 0; border-top:1px solid var(--line); }
  .footer-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .footer-row p{ font-size:.82rem; color:var(--dim); }
  .footer-brand{ display:flex; align-items:center; gap:10px; }
  .footer-brand img{ height:20px; }

  @media (max-width:860px){ .wrap{ padding:0 20px; } .nav-row{ height:64px; } }
</style>
</head>
<body>

<header>
  <div class="wrap nav-row">
    <a href="/" class="logo"><img src="logo.svg" alt="MatMax Intelligence" width="28" height="24">MatMax Intelligence</a>
  </div>
</header>

<main>
  <section class="lost-wrap">
    <div class="lost-card">
      <div class="code">404</div>
      <h1>Cette page n'existe pas</h1>
      <p>Le lien est peut-être incorrect, ou la page a été déplacée. Retournez à l'accueil pour continuer votre navigation.</p>
      <a href="/" class="btn btn-primary">Retour à l'accueil</a>
    </div>
  </section>
</main>

<footer>
  <div class="wrap footer-row">
    <div class="footer-brand"><img src="logo.svg" alt="" width="20" height="17"><p>© 2026 MATMAX INTELLIGENCE — LUXEMBOURG</p></div>
  </div>
</footer>

</body>
</html>
